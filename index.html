<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Books — a Bible reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141b2e;
    --bg-header: #0f1524;
    --ink: #e8e1d0;
    --gold: #c9a867;
    --gold-soft: #e8d9a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    overflow: hidden;
  }
  .font-display { font-family: 'Fraunces', Georgia, serif; }
  ::selection { background: #c9a86733; }

  #app { height: 100vh; width: 100%; display: flex; flex-direction: column; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid #c9a86733;
    background: var(--bg-header); flex-shrink: 0; gap: 8px;
  }
  @media (min-width: 640px) { header { padding: 12px 24px; } }

  #openNavBtn {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; color: var(--gold);
    cursor: pointer; padding: 4px; border-radius: 4px;
    font-family: 'Fraunces', Georgia, serif; font-size: 14px;
  }
  #openNavBtn:hover { color: var(--gold-soft); }
  #openNavBtn:focus-visible { outline: 2px solid var(--gold); }
  #openNavBtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  #openNavBtn span { display: none; }
  @media (min-width: 640px) { #openNavBtn span { display: inline; } }

  #headerTitle { text-align: center; letter-spacing: 0.02em; font-size: 14px; flex: 1; padding: 0 8px; }
  @media (min-width: 640px) { #headerTitle { font-size: 18px; } }

  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  #compareBtn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid #c9a86755; color: var(--gold);
    cursor: pointer; padding: 5px 8px; border-radius: 4px;
    font-family: 'Fraunces', Georgia, serif; font-size: 12px;
  }
  @media (min-width: 640px) { #compareBtn { font-size: 13px; padding: 6px 10px; } }
  #compareBtn:hover { color: var(--gold-soft); border-color: #c9a86799; }
  #compareBtn:focus-visible { outline: 2px solid var(--gold); }
  #compareBtn.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  #compareBtn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  #compareBtn .label { display: none; }
  @media (min-width: 460px) { #compareBtn .label { display: inline; } }

  #versionSelect {
    background: transparent; color: var(--gold);
    font-family: 'Source Serif 4', Georgia, serif; font-size: 12px;
    border: 1px solid #c9a86755; border-radius: 4px; padding: 5px 6px;
  }
  @media (min-width: 640px) { #versionSelect { font-size: 14px; padding: 6px 8px; } }
  #versionSelect:focus-visible { outline: 2px solid var(--gold); }
  #versionSelect option { background: var(--bg); }
  body.compare-mode #versionSelect { display: none; }

  /* Body layout */
  #body { flex: 1; min-height: 0; display: flex; position: relative; }

  /* Overlay + drawer */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 29;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }

  #drawer {
    position: fixed; left: 0; top: 0; height: 100%;
    width: 86vw; max-width: 380px;
    background: var(--bg-header); border-right: 1px solid #c9a86733;
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.3s;
    z-index: 30;
  }
  #drawer.open { transform: translateX(0); }

  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px; flex-shrink: 0;
  }
  .drawer-head .title { font-family: 'Fraunces', Georgia, serif; color: var(--gold); font-size: 18px; }
  .drawer-head .title small {
    display: block; font-family: 'Source Serif 4', Georgia, serif;
    font-size: 11px; color: #c9a86799; text-transform: uppercase; letter-spacing: 0.15em;
    margin-top: 3px; font-weight: normal;
  }
  #closeNavBtn { background: none; border: none; color: #e8e1d0aa; cursor: pointer; padding: 4px; border-radius: 4px; }
  #closeNavBtn:hover { color: var(--ink); }
  #closeNavBtn:focus-visible { outline: 2px solid var(--gold); }
  #closeNavBtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }

  .search-wrap { padding: 0 16px 12px; flex-shrink: 0; position: relative; }
  .search-wrap svg {
    position: absolute; left: 26px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; stroke: #c9a86799; fill: none; stroke-width: 1.5;
  }
  #bookSearch {
    width: 100%; background: var(--bg); border: 1px solid #c9a86733; border-radius: 6px;
    padding: 7px 10px 7px 30px; font-size: 14px; color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
  }
  #bookSearch::placeholder { color: #e8e1d066; }
  #bookSearch:focus-visible { outline: 2px solid var(--gold); }

  #bookList { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
  #bookList::-webkit-scrollbar { width: 6px; }
  #bookList::-webkit-scrollbar-thumb { background: #c9a86755; border-radius: 3px; }

  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;
    color: #c9a86799; margin: 14px 0 6px;
  }
  .book-btn {
    display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 4px;
    font-size: 14px; color: #e8e1d0cc; background: none; border: none; cursor: pointer;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .book-btn:hover { background: #c9a86711; color: var(--ink); }
  .book-btn.active { background: #c9a86722; color: var(--gold); }
  .book-btn:focus-visible { outline: 2px solid var(--gold); }
  .no-match { color: #e8e1d066; font-size: 14px; padding: 8px 8px 0; }

  .chapter-picker {
    border-top: 1px solid #c9a86733; padding: 12px 16px; flex-shrink: 0;
    max-height: 160px; overflow-y: auto;
  }
  .chapter-picker::-webkit-scrollbar { width: 6px; }
  .chapter-picker::-webkit-scrollbar-thumb { background: #c9a86755; border-radius: 3px; }
  .chapter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: #c9a86799; margin-bottom: 8px; }
  .chapter-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .chapter-btn {
    width: 32px; height: 32px; border-radius: 4px; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    background: #c9a86714; color: #e8e1d0cc; border: none; cursor: pointer;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .chapter-btn:hover { background: #c9a86733; }
  .chapter-btn.active { background: var(--gold); color: var(--bg); font-weight: 600; }
  .chapter-btn:focus-visible { outline: 2px solid var(--gold); }

  /* Reading area: holds one or two panes */
  #readingArea { flex: 1; display: flex; min-width: 0; min-height: 0; }
  body.compare-mode #readingArea { flex-direction: column; overflow-y: auto; }
  @media (min-width: 900px) {
    body.compare-mode #readingArea { flex-direction: row; overflow-y: hidden; }
  }

  .pane { display: none; flex: 1; min-width: 0; min-height: 0; flex-direction: column; }
  .pane[data-pane="a"] { display: flex; }
  body.compare-mode .pane { display: flex; }
  body.compare-mode .pane[data-pane="b"] { border-top: 1px solid #c9a86733; }
  @media (min-width: 900px) {
    body.compare-mode .pane[data-pane="b"] { border-top: none; }
  }

  .pane-toolbar {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 20px; border-bottom: 1px solid #c9a86722; flex-shrink: 0;
  }
  body.compare-mode .pane-toolbar { display: flex; }
  @media (min-width: 640px) { .pane-toolbar { padding: 10px 40px; } }

  .pane-ref-btn {
    background: none; border: none; color: var(--gold-soft); cursor: pointer;
    font-family: 'Fraunces', Georgia, serif; font-size: 14px; text-align: left;
    padding: 3px 4px; border-radius: 4px; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .pane-ref-btn:hover { color: var(--gold); }
  .pane-ref-btn:focus-visible { outline: 2px solid var(--gold); }

  .pane-version {
    background: transparent; color: var(--gold);
    font-family: 'Source Serif 4', Georgia, serif; font-size: 12px;
    border: 1px solid #c9a86755; border-radius: 4px; padding: 4px 6px; flex-shrink: 0;
  }
  .pane-version:focus-visible { outline: 2px solid var(--gold); }
  .pane-version option { background: var(--bg); }

  .spine {
    display: none; width: 20px; flex-shrink: 0;
    background: repeating-linear-gradient(180deg, var(--gold) 0px, var(--gold) 2px, transparent 2px, transparent 14px);
  }
  @media (min-width: 640px) { .spine { display: block; } }
  body.compare-mode .spine { display: none; }

  .pane-body { flex: 1; display: flex; min-height: 0; }

  main { flex: 1; overflow-y: auto; padding: 32px 20px; }
  @media (min-width: 640px) { main { padding: 32px 40px; } }
  @media (min-width: 768px) { main { padding: 32px 64px; } }
  body.compare-mode main { padding: 24px 20px; }
  @media (min-width: 640px) { body.compare-mode main { padding: 28px 32px; } }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #c9a86733; border-radius: 4px; }

  .reader-inner { max-width: 680px; margin: 0 auto; }
  body.compare-mode .reader-inner { max-width: none; }

  .skeleton { display: flex; flex-direction: column; gap: 12px; }
  .skel-line { height: 16px; background: #c9a86718; border-radius: 4px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .state-msg { text-align: center; padding: 64px 0; }
  body.compare-mode .state-msg { padding: 40px 0; }
  .state-msg .headline { font-family: 'Fraunces', Georgia, serif; font-size: 18px; color: var(--gold); margin-bottom: 8px; }
  .state-msg .detail { font-size: 14px; color: #e8e1d0aa; margin-bottom: 16px; }
  .retry-btn {
    font-size: 14px; color: var(--bg); background: var(--gold); border: none; border-radius: 4px;
    padding: 6px 16px; cursor: pointer; font-family: 'Source Serif 4', Georgia, serif;
  }
  .retry-btn:hover { background: var(--gold-soft); }
  .retry-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .chapter-heading { text-align: center; margin-bottom: 32px; }
  body.compare-mode .chapter-heading { margin-bottom: 20px; }
  .chapter-heading .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.25em; color: #c9a86799; margin-bottom: 4px; }
  .chapter-heading h1 { font-family: 'Fraunces', Georgia, serif; font-size: 30px; color: #f0e9d8; font-weight: 500; margin: 0; }
  body.compare-mode .chapter-heading h1 { font-size: 24px; }
  @media (min-width: 640px) { .chapter-heading h1 { font-size: 36px; } }
  @media (min-width: 640px) { body.compare-mode .chapter-heading h1 { font-size: 26px; } }
  .chapter-heading h1 .chnum { color: var(--gold); }

  .verses-text { font-size: 17px; line-height: 1.9; color: #e8e1d0e6; }
  @media (min-width: 640px) { .verses-text { font-size: 18px; } }
  body.compare-mode .verses-text { font-size: 16px; }
  .verses-text sup {
    font-family: 'Fraunces', Georgia, serif; color: var(--gold); font-size: 11px;
    margin-right: 3px; user-select: none;
  }
  .verses-text sup.highlighted { color: #ff9e6d; }
  .verses-text .diff-word { background: #c9a86733; border-radius: 2px; padding: 0 1px; }

  .fade-in { animation: fadein 0.4s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .pager {
    max-width: 680px; margin: 48px auto 0; padding-top: 24px;
    border-top: 1px solid #c9a86722; display: flex; justify-content: space-between;
  }
  body.compare-mode .pager { max-width: none; margin-top: 28px; }
  .pager button {
    display: flex; align-items: center; gap: 6px; background: none; border: none;
    color: var(--gold); font-size: 14px; cursor: pointer; padding: 4px 8px; border-radius: 4px;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .pager button:hover:not(:disabled) { color: var(--gold-soft); }
  .pager button:disabled { opacity: 0.3; cursor: not-allowed; }
  .pager button:focus-visible { outline: 2px solid var(--gold); }
  .pager svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .swap-btn {
    display: none; align-items: center; justify-content: center;
    background: var(--bg-header); border: 1px solid #c9a86755; color: var(--gold);
    cursor: pointer; border-radius: 999px; padding: 7px; flex-shrink: 0;
    align-self: center; margin: 6px auto; width: 32px; height: 32px;
    position: relative; z-index: 1;
  }
  body.compare-mode .swap-btn { display: flex; }
  @media (min-width: 900px) {
    .swap-btn { margin: 0; transform: rotate(90deg); }
  }
  .swap-btn:hover { color: var(--gold-soft); border-color: #c9a86799; }
  .swap-btn:focus-visible { outline: 2px solid var(--gold); }
  .swap-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .compare-hint {
    display: none; text-align: center; padding: 6px 16px 0;
    font-size: 12px; color: #c9a86799; font-style: italic; flex-shrink: 0;
  }
  body.compare-mode .compare-hint { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="openNavBtn" aria-label="Open book navigator">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Contents</span>
    </button>
    <div id="headerTitle" class="font-display"></div>
    <div class="header-right">
      <button id="compareBtn" aria-pressed="false" title="Compare two passages side by side">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/></svg>
        <span class="label">Compare</span>
      </button>
      <select id="versionSelect" aria-label="Bible version"></select>
    </div>
  </header>

  <p class="compare-hint">Comparing — tap a reference to change it, or use the swap button to flip sides.</p>

  <div id="body">
    <div id="overlay"></div>
    <nav id="drawer" aria-label="Book navigator">
      <div class="drawer-head">
        <span class="title font-display" id="drawerTitle">The Books</span>
        <button id="closeNavBtn" aria-label="Close navigator">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="bookSearch" placeholder="Find a book..." autocomplete="off" />
      </div>
      <div id="bookList"></div>
      <div class="chapter-picker">
        <div class="chapter-label" id="chapterLabel"></div>
        <div class="chapter-grid" id="chapterGrid"></div>
      </div>
    </nav>

    <div id="readingArea">
      <div class="pane" data-pane="a">
        <div class="pane-toolbar">
          <button class="pane-ref-btn" data-pane="a"></button>
          <select class="pane-version" data-pane="a" aria-label="Left passage version"></select>
        </div>
        <div class="pane-body">
          <div class="spine" aria-hidden="true"></div>
          <main data-pane="a">
            <div class="reader-inner" data-pane="a"></div>
            <div class="pager" data-pane="a">
              <button class="prev-btn" data-pane="a">
                <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg> Previous
              </button>
              <button class="next-btn" data-pane="a">
                Next <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </main>
        </div>
      </div>

      <button class="swap-btn" id="swapBtn" aria-label="Swap left and right passages" title="Swap panes">
        <svg viewBox="0 0 24 24"><path d="M17 3v18M17 3l-4 4M17 3l4 4M7 21V3M7 21l-4-4M7 21l4-4"/></svg>
      </button>

      <div class="pane" data-pane="b">
        <div class="pane-toolbar">
          <button class="pane-ref-btn" data-pane="b"></button>
          <select class="pane-version" data-pane="b" aria-label="Right passage version"></select>
        </div>
        <div class="pane-body">
          <div class="spine" aria-hidden="true"></div>
          <main data-pane="b">
            <div class="reader-inner" data-pane="b"></div>
            <div class="pager" data-pane="b">
              <button class="prev-btn" data-pane="b">
                <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg> Previous
              </button>
              <button class="next-btn" data-pane="b">
                Next <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const BOOKS = [
    ["genesis","Genesis",50],["exodus","Exodus",40],["leviticus","Leviticus",27],
    ["numbers","Numbers",36],["deuteronomy","Deuteronomy",34],["joshua","Joshua",24],
    ["judges","Judges",21],["ruth","Ruth",4],["1-samuel","1 Samuel",31],
    ["2-samuel","2 Samuel",24],["1-kings","1 Kings",22],["2-kings","2 Kings",25],
    ["1-chronicles","1 Chronicles",29],["2-chronicles","2 Chronicles",36],
    ["ezra","Ezra",10],["nehemiah","Nehemiah",13],["esther","Esther",10],
    ["job","Job",42],["psalms","Psalms",150],["proverbs","Proverbs",31],
    ["ecclesiastes","Ecclesiastes",12],["song-of-solomon","Song of Solomon",8],
    ["isaiah","Isaiah",66],["jeremiah","Jeremiah",52],["lamentations","Lamentations",5],
    ["ezekiel","Ezekiel",48],["daniel","Daniel",12],["hosea","Hosea",14],
    ["joel","Joel",3],["amos","Amos",9],["obadiah","Obadiah",1],["jonah","Jonah",4],
    ["micah","Micah",7],["nahum","Nahum",3],["habakkuk","Habakkuk",3],
    ["zephaniah","Zephaniah",3],["haggai","Haggai",2],["zechariah","Zechariah",14],
    ["malachi","Malachi",4],
    ["matthew","Matthew",28],["mark","Mark",16],["luke","Luke",24],["john","John",21],
    ["acts","Acts",28],["romans","Romans",16],["1-corinthians","1 Corinthians",16],
    ["2-corinthians","2 Corinthians",13],["galatians","Galatians",6],
    ["ephesians","Ephesians",6],["philippians","Philippians",4],
    ["colossians","Colossians",4],["1-thessalonians","1 Thessalonians",5],
    ["2-thessalonians","2 Thessalonians",3],["1-timothy","1 Timothy",6],
    ["2-timothy","2 Timothy",4],["titus","Titus",3],["philemon","Philemon",1],
    ["hebrews","Hebrews",13],["james","James",5],["1-peter","1 Peter",5],
    ["2-peter","2 Peter",3],["1-john","1 John",5],["2-john","2 John",1],
    ["3-john","3 John",1],["jude","Jude",1],["revelation","Revelation",22],
  ];
  const OT = BOOKS.slice(0, 39);
  const NT = BOOKS.slice(39);

  // bible-api.com uses its own spelling for a handful of books that differ
  // from our nav ids (which use hyphenated slugs for lookups/URLs).
  const API_BOOK_NAME = {
    "1-samuel": "1 Samuel", "2-samuel": "2 Samuel",
    "1-kings": "1 Kings", "2-kings": "2 Kings",
    "1-chronicles": "1 Chronicles", "2-chronicles": "2 Chronicles",
    "song-of-solomon": "Song of Solomon",
    "1-corinthians": "1 Corinthians", "2-corinthians": "2 Corinthians",
    "1-thessalonians": "1 Thessalonians", "2-thessalonians": "2 Thessalonians",
    "1-timothy": "1 Timothy", "2-timothy": "2 Timothy",
    "1-peter": "1 Peter", "2-peter": "2 Peter",
    "1-john": "1 John", "2-john": "2 John", "3-john": "3 John",
  };

  const VERSIONS = [
    ["kjv", "King James Version"],
    ["asv", "American Standard Version"],
    ["bbe", "Bible in Basic English"],
    ["web", "World English Bible"],
  ];

  function apiBookName(bookId, displayName) {
    return API_BOOK_NAME[bookId] || displayName;
  }

  // ---- per-pane state ----
  // Two independent panes, "a" and "b". In single mode only "a" is shown
  // and drives the header title / version select. In compare mode both
  // panes have their own toolbar with a reference button + version select.
  const panes = {
    a: { bookIdx: BOOKS.findIndex((b) => b[0] === "john"), chapter: 1, version: "kjv", requestId: 0 },
    b: { bookIdx: BOOKS.findIndex((b) => b[0] === "genesis"), chapter: 1, version: "kjv", requestId: 0 },
  };
  const cache = {}; // key: version/bookId/chapter -> verses[]

  let compareMode = false;
  let activeDrawerPane = "a"; // which pane the drawer is currently editing
  let query = "";

  // ---- element refs ----
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const openNavBtn = $("openNavBtn"), closeNavBtn = $("closeNavBtn");
  const overlay = $("overlay"), drawer = $("drawer"), drawerTitle = $("drawerTitle");
  const bookSearch = $("bookSearch"), bookList = $("bookList");
  const chapterLabel = $("chapterLabel"), chapterGrid = $("chapterGrid");
  const headerTitle = $("headerTitle"), versionSelect = $("versionSelect");
  const compareBtn = $("compareBtn"), swapBtn = $("swapBtn");

  function paneEl(selector, paneKey) {
    return document.querySelector(selector + '[data-pane="' + paneKey + '"]');
  }
  function paneBook(paneKey) { return BOOKS[panes[paneKey].bookIdx]; }

  // ---- version selects ----
  function buildVersionOptions(select) {
    select.innerHTML = "";
    VERSIONS.forEach(([id, name]) => {
      const opt = document.createElement("option");
      opt.value = id; opt.textContent = name;
      select.appendChild(opt);
    });
  }
  buildVersionOptions(versionSelect);
  versionSelect.value = panes.a.version;
  versionSelect.addEventListener("change", () => {
    panes.a.version = versionSelect.value;
    loadPane("a");
  });

  ["a", "b"].forEach((key) => {
    const sel = paneEl(".pane-version", key);
    buildVersionOptions(sel);
    sel.value = panes[key].version;
    sel.addEventListener("change", () => {
      panes[key].version = sel.value;
      loadPane(key);
    });
  });

  // ---- compare toggle ----
  compareBtn.addEventListener("click", () => {
    compareMode = !compareMode;
    body.classList.toggle("compare-mode", compareMode);
    compareBtn.classList.toggle("active", compareMode);
    compareBtn.setAttribute("aria-pressed", String(compareMode));
    if (compareMode) {
      renderPaneToolbar("a");
      renderPaneToolbar("b");
      // Load pane B if it hasn't been loaded yet under compare mode.
      loadPane("b");
    }
  });

  swapBtn.addEventListener("click", () => {
    const a = panes.a, b = panes.b;
    panes.a = { ...b, requestId: a.requestId };
    panes.b = { ...a, requestId: b.requestId };
    paneEl(".pane-version", "a").value = panes.a.version;
    paneEl(".pane-version", "b").value = panes.b.version;
    loadPane("a");
    loadPane("b");
  });

  // ---- pane reference buttons open the drawer scoped to that pane ----
  ["a", "b"].forEach((key) => {
    paneEl(".pane-ref-btn", key).addEventListener("click", () => openDrawerFor(key));
  });

  function openDrawerFor(paneKey) {
    activeDrawerPane = paneKey;
    drawerTitle.innerHTML = compareMode
      ? "The Books<small>" + (paneKey === "a" ? "Left passage" : "Right passage") + "</small>"
      : "The Books";
    renderBookList();
    renderChapterPicker();
    openDrawer();
  }

  // ---- drawer open/close ----
  function openDrawer() { drawer.classList.add("open"); overlay.classList.add("open"); }
  function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); }
  openNavBtn.addEventListener("click", () => openDrawerFor("a"));
  closeNavBtn.addEventListener("click", closeDrawer);
  overlay.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
  });

  // ---- book list rendering (scoped to activeDrawerPane) ----
  function renderBookList() {
    bookList.innerHTML = "";
    const q = query.trim().toLowerCase();
    const activeIdx = panes[activeDrawerPane].bookIdx;

    if (q === "") {
      bookList.appendChild(sectionEl("Old Testament", OT, 0, activeIdx));
      bookList.appendChild(sectionEl("New Testament", NT, 39, activeIdx));
    } else {
      const wrap = document.createElement("div");
      const matches = BOOKS.filter(([, name]) => name.toLowerCase().includes(q));
      matches.forEach(([id, name]) => {
        const idx = BOOKS.findIndex((b) => b[0] === id);
        wrap.appendChild(bookBtn(name, idx, activeIdx));
      });
      if (matches.length === 0) {
        const p = document.createElement("p");
        p.className = "no-match";
        p.textContent = 'No book matches "' + query + '".';
        wrap.appendChild(p);
      }
      bookList.appendChild(wrap);
    }
  }

  function sectionEl(title, books, offset, activeIdx) {
    const wrap = document.createElement("div");
    const label = document.createElement("div");
    label.className = "section-label";
    label.textContent = title;
    wrap.appendChild(label);
    books.forEach(([id, name], i) => {
      wrap.appendChild(bookBtn(name, offset + i, activeIdx));
    });
    return wrap;
  }

  function bookBtn(name, idx, activeIdx) {
    const btn = document.createElement("button");
    btn.className = "book-btn" + (idx === activeIdx ? " active" : "");
    btn.textContent = name;
    btn.addEventListener("click", () => selectBook(idx));
    return btn;
  }

  function selectBook(idx) {
    const paneKey = activeDrawerPane;
    panes[paneKey].bookIdx = idx;
    panes[paneKey].chapter = 1;
    query = "";
    bookSearch.value = "";
    renderChapterPicker();
    renderBookList();
  }

  bookSearch.addEventListener("input", () => {
    query = bookSearch.value;
    renderBookList();
  });

  // ---- chapter picker (scoped to activeDrawerPane) ----
  function renderChapterPicker() {
    const paneKey = activeDrawerPane;
    const book = paneBook(paneKey);
    const currentChapter = panes[paneKey].chapter;
    chapterLabel.textContent = book[1] + " — " + book[2] + " chapters";
    chapterGrid.innerHTML = "";
    for (let c = 1; c <= book[2]; c++) {
      const btn = document.createElement("button");
      btn.className = "chapter-btn" + (c === currentChapter ? " active" : "");
      btn.textContent = c;
      btn.addEventListener("click", () => {
        panes[paneKey].chapter = c;
        closeDrawer();
        loadPane(paneKey);
      });
      chapterGrid.appendChild(btn);
    }
  }

  // ---- navigation (per pane) ----
  function goPrev(paneKey) {
    const p = panes[paneKey];
    if (p.chapter > 1) {
      p.chapter -= 1;
    } else if (p.bookIdx > 0) {
      p.bookIdx -= 1;
      p.chapter = BOOKS[p.bookIdx][2];
    } else {
      return;
    }
    loadPane(paneKey);
  }

  function goNext(paneKey) {
    const p = panes[paneKey];
    const book = BOOKS[p.bookIdx];
    if (p.chapter < book[2]) {
      p.chapter += 1;
    } else if (p.bookIdx < BOOKS.length - 1) {
      p.bookIdx += 1;
      p.chapter = 1;
    } else {
      return;
    }
    loadPane(paneKey);
  }

  document.querySelectorAll(".prev-btn").forEach((btn) => {
    btn.addEventListener("click", () => goPrev(btn.getAttribute("data-pane")));
  });
  document.querySelectorAll(".next-btn").forEach((btn) => {
    btn.addEventListener("click", () => goNext(btn.getAttribute("data-pane")));
  });

  // ---- fetching ----
  function loadPane(paneKey) {
    const p = panes[paneKey];
    const book = BOOKS[p.bookIdx];

    updateHeaderAndToolbar(paneKey);
    updatePagerState(paneKey);

    const key = p.version + "/" + book[0] + "/" + p.chapter;
    if (cache[key]) {
      renderVerses(paneKey, cache[key]);
      scrollPaneTop(paneKey);
      return;
    }

    const thisRequest = ++p.requestId;
    renderLoading(paneKey);

    const reference = encodeURIComponent(apiBookName(book[0], book[1]) + " " + p.chapter);
    const url = "https://bible-api.com/" + reference + "?translation=" + p.version;

    fetch(url)
      .then((r) => {
        if (!r.ok) throw new Error("http-" + r.status);
        return r.json();
      })
      .then((data) => {
        if (thisRequest !== p.requestId) return; // stale, superseded
        if (data && data.error) throw new Error("api-error");
        const verses = Array.isArray(data && data.verses)
          ? data.verses.map((v) => ({
              verse: v.verse,
              text: (v.text || "").replace(/\s+/g, " ").trim(),
            }))
          : [];
        cache[key] = verses;
        renderVerses(paneKey, verses);
        scrollPaneTop(paneKey);
      })
      .catch((err) => {
        if (thisRequest !== p.requestId) return;
        renderError(paneKey, err.message || "load-failed");
      });
  }

  function scrollPaneTop(paneKey) {
    const main = paneEl("main", paneKey);
    main.scrollTo({ top: 0, behavior: "instant" });
  }

  function updateHeaderAndToolbar(paneKey) {
    const book = BOOKS[panes[paneKey].bookIdx];
    const label = book[1] + " " + panes[paneKey].chapter;
    if (paneKey === "a" && !compareMode) {
      headerTitle.textContent = label;
    }
    if (compareMode) {
      renderPaneToolbar(paneKey);
      headerTitle.textContent = "Comparing";
    }
  }

  function renderPaneToolbar(paneKey) {
    const book = BOOKS[panes[paneKey].bookIdx];
    const refBtn = paneEl(".pane-ref-btn", paneKey);
    refBtn.textContent = book[1] + " " + panes[paneKey].chapter;
  }

  function updatePagerState(paneKey) {
    const p = panes[paneKey];
    const book = BOOKS[p.bookIdx];
    paneEl(".prev-btn", paneKey).disabled = p.bookIdx === 0 && p.chapter === 1;
    paneEl(".next-btn", paneKey).disabled = p.bookIdx === BOOKS.length - 1 && p.chapter === book[2];
  }

  function versionName(id) {
    const v = VERSIONS.find((v) => v[0] === id);
    return v ? v[1] : id;
  }

  function renderLoading(paneKey) {
    const inner = paneEl(".reader-inner", paneKey);
    inner.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "skeleton";
    for (let i = 0; i < 8; i++) {
      const line = document.createElement("div");
      line.className = "skel-line";
      line.style.width = (70 + (i % 3) * 10) + "%";
      wrap.appendChild(line);
    }
    inner.appendChild(wrap);
  }

  function renderError(paneKey, reason) {
    const p = panes[paneKey];
    const book = BOOKS[p.bookIdx];
    const inner = paneEl(".reader-inner", paneKey);
    inner.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "state-msg";
    wrap.innerHTML =
      '<p class="headline font-display">This chapter didn\'t load.</p>' +
      '<p class="detail">' + book[1] + " " + p.chapter + " in " + versionName(p.version) +
      " couldn't be reached (" + reason + ").</p>";
    const retry = document.createElement("button");
    retry.className = "retry-btn";
    retry.textContent = "Try again";
    retry.addEventListener("click", () => loadPane(paneKey));
    wrap.appendChild(retry);
    inner.appendChild(wrap);
  }

  function renderVerses(paneKey, verses) {
    const p = panes[paneKey];
    const book = BOOKS[p.bookIdx];
    const inner = paneEl(".reader-inner", paneKey);
    inner.innerHTML = "";

    if (!verses || verses.length === 0) {
      const wrap = document.createElement("div");
      wrap.className = "state-msg";
      wrap.innerHTML = '<p class="detail">No verses returned for this chapter.</p>';
      inner.appendChild(wrap);
      return;
    }

    const container = document.createElement("div");
    container.className = "fade-in";

    const heading = document.createElement("div");
    heading.className = "chapter-heading";
    heading.innerHTML =
      '<div class="eyebrow">' + versionName(p.version) + " · public domain</div>" +
      "<h1>" + book[1] + ' <span class="chnum">' + p.chapter + "</span></h1>";
    container.appendChild(heading);

    const versesEl = document.createElement("div");
    versesEl.className = "verses-text";
    verses.forEach((v) => {
      const span = document.createElement("span");
      const sup = document.createElement("sup");
      sup.textContent = v.verse;
      span.appendChild(sup);
      span.appendChild(document.createTextNode(v.text + " "));
      versesEl.appendChild(span);
    });
    container.appendChild(versesEl);

    inner.appendChild(container);
  }

  // ---- init ----
  loadPane("a");
})();
</script>
</body>
</html>

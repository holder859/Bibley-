<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Books — Bible Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141b2e;
    --bg-header: #0f1524;
    --bg-panel: #111a2f;
    --ink: #e8e1d0;
    --ink-dim: #e8e1d0a6;
    --ink-faint: #e8e1d066;
    --gold: #c9a867;
    --gold-soft: #e8d9a8;
    --border: #c9a86733;
    --panel-border: #2a3658;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Source Serif 4', Georgia, serif; overflow:hidden; }
  .font-display { font-family:'Fraunces', Georgia, serif; }
  #app { height:100vh; display:flex; flex-direction:column; }

  header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-header); flex-shrink:0; gap:8px; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  header::-webkit-scrollbar { height:4px; } header::-webkit-scrollbar-thumb { background:#c9a86744; border-radius:2px; }
  @media(min-width:640px){ header{ padding:12px 20px; } }
  #openNavBtn, #openAiBtn, #compareBtn, #bookmarkBtn, #fullscreenBtn { flex-shrink:0; }
  #headerTitle { flex-shrink:0; }
  @media(max-width:640px){
    header { justify-content:flex-start; }
    #headerTitle { order:-1; min-width:110px; text-align:left; margin-right:4px; }
    .header-right { flex-shrink:0; }
  }
  #openNavBtn, #openAiBtn, #compareBtn, #bookmarkBtn, #fullscreenBtn {
    display:flex; align-items:center; gap:6px; background:none; border:1px solid var(--border); color:var(--gold);
    padding:6px 11px; border-radius:8px; font-family:'Fraunces'; font-size:13px; cursor:pointer; transition:.2s;
  }
  #openNavBtn:hover, #compareBtn:hover, #openAiBtn:hover, #bookmarkBtn:hover, #fullscreenBtn:hover { border-color:#c9a86777; color:var(--gold-soft); }
  #openAiBtn { background:#1d2744; border-color:#2f3d66; }
  #openAiBtn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  #bookmarkBtn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  #compareBtn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  #fullscreenBtn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  #headerTitle { flex:1; text-align:center; font-size:15px; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-right { display:flex; gap:6px; align-items:center; }

  #versionSelect { background:transparent; color:var(--gold); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-family:'Source Serif 4'; font-size:13px; flex-shrink:0; }

  #body { flex:1; min-height:0; display:flex; position:relative; overflow:hidden; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:.3s; z-index:29; }
  #overlay.open { opacity:1; pointer-events:auto; }

  #drawer { position:fixed; left:0; top:0; height:100%; width:88vw; max-width:360px; background:var(--bg-header); border-right:1px solid var(--border); display:flex; flex-direction:column; transform:translateX(-100%); transition:transform .3s cubic-bezier(.4,0,.2,1); z-index:30; }
  #drawer.open { transform:translateX(0); }
  .drawer-head { display:flex; justify-content:space-between; align-items:center; padding:18px 16px 10px; flex-shrink:0; }
  .drawer-head .title { font-family:'Fraunces'; color:var(--gold); font-size:18px; line-height:1.1; }
  .drawer-head .title small { display:block; font-family:'Source Serif 4'; font-size:10px; color:#c9a86799; text-transform:uppercase; letter-spacing:.14em; margin-top:4px; }
  #closeNavBtn { background:none; border:none; color:var(--ink-dim); cursor:pointer; padding:6px; }
  .search-wrap { padding:12px 16px 8px; flex-shrink:0; }
  #bookSearch { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:14px; color:var(--ink); font-family:'Source Serif 4'; }
  #bookSearch:focus { outline:2px solid var(--gold); }

  #bookmarkList { padding:0 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0; max-height:140px; overflow-y:auto; display:none; }
  #bookmarkList.has-items { display:block; }
  #bookmarkList h4 { font-family:'Fraunces'; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:10px 0 6px; }
  .bm-item, .hl-item-drawer { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-radius:6px; background:#1a2440; border:1px solid var(--panel-border); margin-bottom:6px; cursor:pointer; }
  .bm-item:hover { border-color:var(--gold); }
  .bm-item span, .hl-item-drawer span { font-size:13px; color:var(--ink); }
  .bm-item button, .hl-item-drawer button { background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:12px; }

  #bookList { flex:1; overflow-y:auto; padding:0 16px 16px; }
  .section-label { font-size:10px; text-transform:uppercase; letter-spacing:.2em; color:#c9a86799; margin:16px 0 6px; font-family:'Fraunces'; }
  .book-btn { display:flex; width:100%; justify-content:space-between; align-items:center; text-align:left; padding:7px 10px; border-radius:6px; border:none; background:none; color:#e8e1d0cc; font-size:14px; cursor:pointer; font-family:'Source Serif 4'; }
  .book-btn:hover { background:#c9a86711; color:var(--ink); } .book-btn.active { background:#c9a86722; color:var(--gold); }
  .book-btn .mark-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); display:none; }
  .book-btn.bookmarked .mark-dot { display:block; }
  .chapter-picker { border-top:1px solid var(--border); padding:12px 16px; max-height:150px; overflow-y:auto; flex-shrink:0; }
  .chapter-grid { display:flex; flex-wrap:wrap; gap:6px; }
  .ch-btn { width:36px; height:32px; display:grid; place-items:center; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink-dim); font-size:13px; cursor:pointer; position:relative; }
  .ch-btn:hover { border-color:var(--gold); color:var(--ink); } .ch-btn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  .ch-btn.bookmarked::after { content:""; position:absolute; top:2px; right:2px; width:5px; height:5px; background:var(--gold); border-radius:50%; }
  .ch-btn.active.bookmarked::after { background:var(--bg); }

  #panes { flex:1; display:flex; min-width:0; min-height:0; }
  .pane { flex:1; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--border); background:var(--bg); }
  .pane:last-child { border-right:none; }
  .pane-toolbar { display:none; padding:8px 16px; border-bottom:1px solid var(--border); background:var(--bg-header); justify-content:space-between; align-items:center; gap:8px; }
  body.compare-mode .pane-toolbar { display:flex; }
  .pane-ref-btn { background:none; border:1px solid var(--border); color:var(--gold); padding:4px 10px; border-radius:6px; font-family:'Fraunces'; font-size:13px; cursor:pointer; }
  .pane-toolbar { position:relative; }
  .ref-picker { display:none; position:absolute; top:calc(100% + 4px); left:8px; width:280px; max-width:80vw; max-height:360px; background:var(--bg-header); border:1px solid var(--panel-border); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.45); z-index:25; flex-direction:column; overflow:hidden; }
  .ref-picker.open { display:flex; }
  .ref-picker .rp-search { padding:8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .ref-picker .rp-search input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:13px; color:var(--ink); font-family:'Source Serif 4'; }
  .ref-picker .rp-books { flex:1; overflow-y:auto; padding:4px 6px; max-height:180px; }
  .ref-picker .rp-book-btn { display:block; width:100%; text-align:left; padding:6px 8px; border-radius:6px; border:none; background:none; color:#e8e1d0cc; font-size:13px; cursor:pointer; font-family:'Source Serif 4'; }
  .ref-picker .rp-book-btn:hover { background:#c9a86711; color:var(--ink); }
  .ref-picker .rp-book-btn.active { background:#c9a86722; color:var(--gold); }
  .ref-picker .rp-chapters { border-top:1px solid var(--border); padding:8px; flex-shrink:0; max-height:150px; overflow-y:auto; }
  .ref-picker .rp-chapter-grid { display:flex; flex-wrap:wrap; gap:5px; }
  .ref-picker .rp-ch-btn { width:30px; height:28px; display:grid; place-items:center; border-radius:5px; border:1px solid var(--border); background:var(--bg); color:var(--ink-dim); font-size:12px; cursor:pointer; }
  .ref-picker .rp-ch-btn:hover { border-color:var(--gold); color:var(--ink); }
  .ref-picker .rp-ch-btn.active { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  .reader-main { flex:1; overflow-y:auto; padding:24px 20px 80px; }
  @media(min-width:900px){ .reader-main{ padding:36px 48px 80px; } }
  .reader-main::-webkit-scrollbar{ width:8px; } .reader-main::-webkit-scrollbar-thumb{ background:#c9a86744; border-radius:4px; }
  .chapter-heading { margin-bottom:26px; border-bottom:1px solid var(--border); padding-bottom:18px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; }
  .chapter-heading .left .eyebrow { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#c9a86799; margin-bottom:8px; }
  .chapter-heading h1 { font-family:'Fraunces'; font-weight:500; font-size:32px; margin:0; }
  .chapter-heading h1 .chnum { color:var(--gold); }
  .chapter-heading .right button { background:none; border:1px solid var(--border); color:var(--gold); padding:6px 10px; border-radius:8px; font-family:'Fraunces'; font-size:12px; cursor:pointer; }
  .chapter-heading .right button.active { background:var(--gold); color:var(--bg); }

  .verses-text { font-size:19px; line-height:1.78; }
  .verses-text span { cursor:pointer; border-radius:4px; padding:1px 3px; transition:all .15s; position:relative; }
  .verses-text span:hover { background:#c9a86711; }
  .verses-text span.selected { background:#c9a86722; box-shadow:inset 0 0 0 1px #c9a86744; }
  .verses-text sup { font-family:'Fraunces'; font-size:11px; color:var(--gold); margin-right:4px; font-weight:600; vertical-align:super; user-select:none; }

  /* Highlight colors */
  .verses-text span.hl-yellow { background:#fde68a55; box-shadow:inset 0 -2px 0 #fde68a; }
  .verses-text span.hl-green { background:#a7f3d055; box-shadow:inset 0 -2px 0 #6ee7b7; }
  .verses-text span.hl-blue { background:#bfdbfe55; box-shadow:inset 0 -2px 0 #93c5fd; }
  .verses-text span.hl-pink { background:#fbcfe855; box-shadow:inset 0 -2px 0 #f9a8d4; }
  .verses-text span.hl-yellow.selected, .verses-text span.hl-green.selected, .verses-text span.hl-blue.selected, .verses-text span.hl-pink.selected { box-shadow:inset 0 0 0 1px #c9a86766, inset 0 -2px 0 currentColor; }

  .pager { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-top:1px solid var(--border); background:var(--bg-header); }
  .pager button { background:none; border:1px solid var(--border); color:var(--gold); padding:6px 12px; border-radius:8px; font-family:'Fraunces'; font-size:13px; cursor:pointer; }
  .pager button:disabled { opacity:.35; pointer-events:none; }
  .skeleton { display:flex; flex-direction:column; gap:12px; } .skel-line { height:14px; background:linear-gradient(90deg,#1d2740 25%,#23304e 50%,#1d2740 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:4px; }
  @keyframes shimmer{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .state-msg { text-align:center; padding:40px 20px; color:var(--ink-dim); }

  /* AI Panel */
  #aiPanel { position:fixed; right:0; top:0; height:100%; width:94vw; max-width:440px; background:linear-gradient(180deg,var(--bg-panel) 0%, #0d1426 100%); border-left:1px solid var(--panel-border); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .35s cubic-bezier(.4,0,.2,1); z-index:31; box-shadow:-20px 0 60px rgba(0,0,0,.5); }
  #aiPanel.open { transform:translateX(0); }
  .ai-head { padding:16px 18px; border-bottom:1px solid var(--panel-border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .ai-head h2 { font-family:'Fraunces'; font-size:16px; color:var(--ink); margin:0; font-weight:500; }
  .ai-head h2 span { color:var(--gold); font-weight:600; }
  .model-badge { font-family:'Source Serif 4'; font-size:10.5px; color:var(--ink-faint); font-weight:400; margin-top:3px; letter-spacing:.01em; }
  .model-badge.ready::before { content:"● "; color:#7fd99a; }
  .model-badge.loading::before { content:"● "; color:var(--gold); }
  .model-badge.error::before { content:"● "; color:#e08a8a; }
  #closeAiBtn { background:none; border:none; color:var(--ink-dim); cursor:pointer; padding:6px; }
  .ai-tabs { display:flex; gap:4px; padding:10px 12px; border-bottom:1px solid var(--panel-border); flex-shrink:0; overflow-x:auto; }
  .ai-tab { flex:1; min-width:70px; padding:8px 6px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--ink-dim); font-family:'Fraunces'; font-size:11.5px; cursor:pointer; transition:.2s; white-space:nowrap; }
  .ai-tab.active { background:#1e2a4a; border-color:#2f3d66; color:var(--gold-soft); }
  .ai-content { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .ai-content::-webkit-scrollbar{ width:6px; } .ai-content::-webkit-scrollbar-thumb{ background:#2f3d66; border-radius:3px; }
  .ai-card { background:#1a2440; border:1px solid var(--panel-border); border-radius:12px; padding:14px; }
  .ai-card.gold { background:#211e16; border-color:#c9a86722; }
  .ai-card h3 { font-family:'Fraunces'; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:0 0 8px; }
  .ai-card p { font-size:14px; line-height:1.6; margin:0; color:var(--ink); }
  .ai-card .verse-ref { font-family:'Fraunces'; font-size:13px; color:var(--gold); margin-bottom:6px; }
  .ai-card .verse-text { font-style:italic; color:var(--gold-soft); font-size:14px; line-height:1.5; margin-bottom:10px; }
  .bullet { display:flex; gap:10px; margin:10px 0; }
  .bullet .num { width:22px; height:22px; border-radius:50%; background:#c9a86722; border:1px solid #c9a86733; display:grid; place-items:center; font-size:11px; color:var(--gold); flex-shrink:0; font-family:'Fraunces'; }
  .bullet p { font-size:14px; line-height:1.55; }

  .hl-controls { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .hl-btn { width:32px; height:32px; border-radius:8px; border:2px solid transparent; cursor:pointer; display:grid; place-items:center; transition:.2s; }
  .hl-btn.yellow { background:#fde68a; } .hl-btn.green { background:#a7f3d0; } .hl-btn.blue { background:#bfdbfe; } .hl-btn.pink { background:#fbcfe8; }
  .hl-btn.clear { background:transparent; border-color:var(--border); color:var(--ink-dim); font-size:12px; width:auto; padding:0 10px; font-family:'Fraunces'; }
  .hl-btn.active { border-color:var(--gold); box-shadow:0 0 0 2px #c9a86744; }
  .hl-btn:hover { transform:translateY(-1px); }

  .scripture-source { margin-top:10px; padding:10px; background:#141e36; border:1px solid #2a3658; border-radius:8px; }
  .scripture-source .ref { font-family:'Fraunces'; font-size:12px; color:var(--gold); font-weight:600; }
  .scripture-source .text { font-size:13px; color:var(--ink); line-height:1.5; margin-top:4px; }

  #aiChatLog { display:flex; flex-direction:column; gap:10px; flex:1; min-height:200px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; font-size:13.5px; line-height:1.55; }
  .msg.user { align-self:flex-end; background:var(--gold); color:var(--bg); border-bottom-right-radius:4px; }
  .msg.ai { align-self:flex-start; background:#1e2a4a; border:1px solid #2a3658; color:var(--ink); border-bottom-left-radius:4px; }
  .ai-empty { text-align:center; padding:30px 16px; color:var(--ink-dim); }
  .thinking-dots { display:inline-flex; align-items:center; gap:3px; color:var(--ink-dim); font-style:italic; }
  .thinking-dots i { width:4px; height:4px; border-radius:50%; background:var(--gold); display:inline-block; animation:tdot 1.1s infinite ease-in-out; }
  .thinking-dots i:nth-child(2){ animation-delay:.15s; } .thinking-dots i:nth-child(3){ animation-delay:.3s; }
  @keyframes tdot{ 0%,80%,100%{ opacity:.25; transform:translateY(0); } 40%{ opacity:1; transform:translateY(-2px); } }
  #aiChatInput:disabled, #aiChatSend:disabled { opacity:.6; cursor:not-allowed; }
  .ai-action-btn { width:100%; padding:10px; border-radius:10px; border:1px solid #2f3d66; background:#1d2744; color:var(--gold-soft); font-family:'Fraunces'; font-size:13px; cursor:pointer; }
  .ai-action-btn:hover { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  #aiChatForm { display:flex; gap:8px; padding:12px; border-top:1px solid var(--panel-border); background:#0f172c; flex-shrink:0; }
  #aiChatInput { flex:1; background:var(--bg); border:1px solid #2f3d66; border-radius:10px; padding:10px 12px; color:var(--ink); font-family:'Source Serif 4'; font-size:14px; }
  #aiChatInput:focus { outline:2px solid var(--gold); }
  #aiChatSend { background:var(--gold); color:var(--bg); border:none; border-radius:10px; padding:0 14px; cursor:pointer; font-family:'Fraunces'; font-weight:600; }

  .marks-list { display:flex; flex-direction:column; gap:8px; }
  .mark-item { background:#1a2440; border:1px solid var(--panel-border); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; cursor:pointer; }
  .mark-item:hover { border-color:#c9a86755; }
  .mark-item .left .ref { font-family:'Fraunces'; font-size:13px; color:var(--gold); }
  .mark-item .left .snippet { font-size:12px; color:var(--ink-dim); margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mark-item .right { display:flex; gap:6px; align-items:center; flex-shrink:0; }
  .color-dot { width:12px; height:12px; border-radius:50%; }
  .color-dot.yellow { background:#fde68a; } .color-dot.green { background:#a7f3d0; } .color-dot.blue { background:#bfdbfe; } .color-dot.pink { background:#fbcfe8; }
  .icon-btn { background:none; border:1px solid var(--border); color:var(--ink-dim); border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; font-family:'Fraunces'; }
  .icon-btn:hover { color:var(--ink); border-color:var(--gold); }

  .fade-in { animation:fade .3s ease; } @keyframes fade{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  @media(max-width:700px){ #aiPanel{ width:100vw; max-width:100vw; } .verses-text{ font-size:17px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="openNavBtn">Books</button>
    <div id="headerTitle" class="font-display">Genesis 1</div>
    <div class="header-right">
      <button id="bookmarkBtn" title="Bookmark this chapter">Bookmark</button>
      <button id="openAiBtn">Study</button>
      <button id="compareBtn">Compare</button>
      <button id="fullscreenBtn" title="Toggle fullscreen">⤢</button>
      <select id="versionSelect"></select>
    </div>
  </header>

  <div id="body">
    <div id="overlay"></div>
    <nav id="drawer">
      <div class="drawer-head"><div class="title">The Books<small>66 books</small></div><button id="closeNavBtn">Close</button></div>
      <div class="search-wrap"><input id="bookSearch" placeholder="Search books" /></div>
      <div id="bookmarkList"></div>
      <div id="bookList"></div>
      <div class="chapter-picker"><div style="font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:#c9a86799; margin-bottom:8px; font-family:Fraunces">Chapters</div><div id="chapterGrid" class="chapter-grid"></div></div>
    </nav>

    <div id="panes">
      <div class="pane" data-pane="a">
        <div class="pane-toolbar">
          <button class="pane-ref-btn font-display" data-pane="a">Genesis 1</button>
          <span style="font-size:11px;color:var(--ink-dim)" class="pane-version-label" data-pane="a">WEB</span>
          <div class="ref-picker" data-pane="a">
            <div class="rp-search"><input type="text" class="rp-search-input" placeholder="Search books" /></div>
            <div class="rp-books"></div>
            <div class="rp-chapters"><div class="rp-chapter-grid"></div></div>
          </div>
        </div>
        <div class="reader-main" id="main-a"><div class="reader-inner"></div></div>
        <div class="pager"><button class="prev-btn" data-pane="a">Prev</button><span class="pager-label font-display" style="font-size:12px;color:var(--ink-dim)"></span><button class="next-btn" data-pane="a">Next</button></div>
      </div>
      <div class="pane" data-pane="b" style="display:none">
        <div class="pane-toolbar">
          <button class="pane-ref-btn font-display" data-pane="b">Genesis 1</button>

  // In-memory cache so the same verse text isn't re-fetched from the API
  // repeatedly within a session (cleared on page reload -- deliberately not
  // persisted, since it's just an optimization, not user data).
  const verseTextCache = {};
  async function fetchVerseText(ref, version){
    const cacheKey = version+"|"+ref;
    if(verseTextCache[cacheKey]) return verseTextCache[cacheKey];
    const url = "https://bible-api.com/"+encodeURIComponent(ref)+"?translation="+version;
    const response = await fetchWithTimeout(url, {}, 8000);
    if(!response.ok) throw new Error("api-"+response.status);
    const data = await response.json();
    if(data.error) throw new Error("api-error");
    const text = (data.text||"").replace(/\s+/g," ").trim();
    verseTextCache[cacheKey] = text;
    return text;
  }

  const STORAGE_HL = "bible_highlights_v2";
  const STORAGE_BM = "bible_bookmarks_v2";

  function getHighlights(){

    let bms = getBookmarks();

    if(idx>=0){ bms.splice(idx,1); } else { bms.push({bookIdx, chapter, bookName: BOOKS[bookIdx][1], added: Date.now()}); }
    saveBookmarks(bms); return bms;
  }

  const panes = { a:{bookIdx:0, chapter:1, version:"web", requestId:0}, b:{bookIdx:0, chapter:1, version:"kjv", requestId:0} };
  let compareMode=false, cache={}, selectedVerse=null, currentTab="chapter", chatHistory=[];
  let verseSummaryReq=0, chapterSummaryReq=0;

  // --- Real AI: two independent free, keyless, browser-callable text APIs ----
  // Both were verified to work directly from a browser via fetch(), no API key,
  // no signup, no CORS proxy needed:
  //   1. LLM7.io      (https://api.llm7.io/v1)        -- PRIMARY
  //   2. Pollinations  (https://text.pollinations.ai)  -- FALLBACK
  // If the primary provider fails after its own retries, we automatically fall
  // through to the fallback provider before giving up. This is still free,
  // best-effort infrastructure -- no keyless AI API anywhere guarantees 100%
  // uptime -- but two independent providers fail at the same moment far less
  // often than either one alone, so this meaningfully improves reliability.
  function sleep(ms){ return new Promise(res=> setTimeout(res, ms)); }

  async function fetchWithTimeout(url, options, timeoutMs){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // Classifies a failure so the UI can show something more useful than "it broke".
  function describeAiError(err){
    const msg = (err && err.message) || "";
    if(err && err.name==="AbortError") return "timed-out";
    if(msg.indexOf("api-429")===0) return "rate-limited";
    if(msg.indexOf("api-5")===0) return "server-error";
    if(msg.indexOf("api-")===0) return "api-error";
    if(msg==="empty-response" || msg==="malformed-response") return "bad-response";
    if(err instanceof TypeError) return "network"; // fetch throws TypeError on network/CORS failure
    return "unknown";
  }
  const AI_ERROR_MESSAGES = {
    "timed-out": "The free AI service took too long to respond and timed out.",
    "rate-limited": "The free AI service is briefly rate-limited (too many requests right now).",
    "server-error": "The free AI service is temporarily having server issues.",
    "api-error": "The free AI service returned an unexpected error.",
    "bad-response": "The free AI service sent back a response we couldn't read.",
    "network": "Couldn't reach the free AI service -- check your internet connection.",
    "unknown": "The free AI service couldn't finish that request."
  };
  function aiErrorMessage(err){
    const kind = describeAiError(err);
    return AI_ERROR_MESSAGES[kind] + " Both free providers were tried and retried automatically -- this happens occasionally with free public APIs. You can try again below.";
  }

  // Each provider is a plain (system, userMessage, maxTokens) -> text function,
  // so adding a third free provider later just means adding one more entry to
  // AI_PROVIDERS below -- no other code needs to change.
  async function callLLM7(system, userMessage, maxTokens){
    const response = await fetchWithTimeout("https://api.llm7.io/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "default",
        messages: [{ role:"system", content:system }, { role:"user", content:userMessage }],
        temperature: 0.6,
        max_tokens: maxTokens || 400
      })
    }, 20000);
    if(!response.ok) throw new Error("api-"+response.status);
    let data;
    try { data = await response.json(); } catch(e) { throw new Error("malformed-response"); }
    const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!content) throw new Error("empty-response");
    return content;
  }

  async function callPollinations(system, userMessage, maxTokens){
    const response = await fetchWithTimeout("https://text.pollinations.ai/openai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai",
        messages: [{ role:"system", content:system }, { role:"user", content:userMessage }],
        temperature: 0.6,
        max_tokens: maxTokens || 400
      })
    }, 20000);
    if(!response.ok) throw new Error("api-"+response.status);
    let data;
    try { data = await response.json(); } catch(e) { throw new Error("malformed-response"); }
    const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!content) throw new Error("empty-response");
    return content;
  }

  // Order matters: first entry is the primary provider, tried (with its own
  // retries) before falling through to the next.
  const AI_PROVIDERS = [
    { name: "LLM7", call: callLLM7 },
    { name: "Pollinations", call: callPollinations }
  ];

  // Retries a single provider's transient failures (timeouts, network blips,
  // rate limits, 5xx) with increasing backoff, so a brief hiccup doesn't
  // immediately trigger a fallback to the next provider.
  async function callProviderWithRetry(providerCall, system, userMessage, maxTokens, attempts){
    attempts = attempts || 2;
    let lastErr;
    for(let i=0; i<attempts; i++){
      try {
        return await providerCall(system, userMessage, maxTokens);
      } catch(err){
        lastErr = err;
        const isLastAttempt = i===attempts-1;
        if(isLastAttempt) break;
        const kind = describeAiError(err);
        // Back off longer for rate limits/server errors, shorter for one-off blips.
        const base = (kind==="rate-limited" || kind==="server-error") ? 1500 : 700;
        const delay = base * Math.pow(2, i) + Math.random()*300;
        await sleep(delay);
      }
    }
    throw lastErr;
  }

  // Tries each provider in order (each with its own retries) and returns the
  // first successful result. Only throws if every provider failed.
  async function generateWithAI(system, userMessage, maxTokens){
    let lastErr;
    for(let p=0; p<AI_PROVIDERS.length; p++){
      const provider = AI_PROVIDERS[p];
      try {
        return await callProviderWithRetry(provider.call, system, userMessage, maxTokens, 2);
      } catch(err){
        console.warn(provider.name+" failed, "+(p<AI_PROVIDERS.length-1 ? "falling back..." : "no providers left."), err);
        lastErr = err;
      }
    }
    throw lastErr;
  }
  // Parses a "LABEL: text" block out of the model's reply — more forgiving
  // than requiring strict JSON, and works well across different free models.
  function parseLabeledSections(raw, keys){
    const result={}; const text=(raw||"").trim();
    for(let i=0;i<keys.length;i++){
      const key=keys[i]; const nextKey=keys[i+1];
      const startRe=new RegExp(key+"\\s*:\\s*","i"); const m=text.match(startRe);
      if(!m){ result[key]=""; continue; }
      const startIdx=m.index+m[0].length; let endIdx=text.length;
      if(nextKey){ const rest=text.slice(startIdx); const endM=rest.match(new RegExp(nextKey+"\\s*:","i")); if(endM) endIdx=startIdx+endM.index; }
      result[key]=text.slice(startIdx,endIdx).trim();
    }
    const anyFound=keys.some(k=> result[k]);
    if(!anyFound) result._fallback=text;
    return result;
  }

  async function generateChapterSummary(book, chapter, verses){
    const system=`You are a careful, denominationally neutral Bible study assistant. You will be given the text of a Bible chapter. Reply in EXACTLY this plain-text format, nothing else, no markdown:
OVERVIEW: (2-3 sentences summarizing the chapter's content and central theme)

- (one sentence on a notable verse or moment)
- (one sentence on a notable verse or moment)
- (one sentence on a notable verse or moment)
STRUCTURE: (1-2 sentences on how the chapter is organized)`;
    const versesText = verses.slice(0,60).map(v=> `${v.verse}. ${v.text}`).join("\n").slice(0,3000);
    const user=`${book[1]} chapter ${chapter}:\n${versesText}`;
    const raw = await generateWithAI(system, user, 350);
    const parsed = parseLabeledSections(raw, ["OVERVIEW","KEY POINTS","STRUCTURE"]);
    if(parsed._fallback) return { overview: parsed._fallback, keyPoints: [], structure: "" };
    const keyPoints = (parsed["KEY POINTS"]||"").split(/\n/).map(l=> l.replace(/^[-•*]\s*/,"").trim()).filter(Boolean).slice(0,6);

  async function answerWithScripture(question){
    const p=panes.a; const book=BOOKS[p.bookIdx]; const key=p.version+"/"+book[0]+"/"+p.chapter; const currentVerses=cache[key]||[];
    const currentText = currentVerses.map(v=> `${book[1]} ${p.chapter}:${v.verse} — ${v.text}`).join("\n").slice(0,2000);
    const system=`You are a warm, denominationally neutral Bible study assistant embedded in a Bible-reading app. Answer the user's question in 2-4 plain-spoken sentences. You may reference the chapter the user is currently reading if it's relevant. Reply with the answer only, no preamble, no markdown.`;
    const user=`Currently reading — ${book[1]} ${p.chapter}:\n${currentText || "(not loaded yet)"}\n\nQuestion: ${question}`;
    const text = await generateWithAI(system, user, 260);
    const sources = await findRelatedVerses(question, currentVerses, book, p.chapter, p.version);
    return {text: text.trim(), sources};

  // Finds candidate cross-references by keyword match against the topic index
  // and the currently-open chapter, then fetches the REAL verse text for each
  // live from bible-api.com, in the reader's current translation. This is
  // deliberately kept separate from the AI's generated answer: better not to
  // trust a free hosted model to quote verses from memory verbatim, when the
  // real text is one fetch away and guaranteed accurate.
  async function findRelatedVerses(question, currentVerses, book, chapter, version){
    const qLow=question.toLowerCase(); const qWords=qLow.match(/\b\w{3,}\b/g)||[];
    const topicScored = SCRIPTURE_TOPIC_INDEX.map(e=>{ let score=0; e.topics.forEach(t=>{ if(qLow.includes(t)) score+=3; }); return {...e, score}; }).filter(e=>e.score>0).sort((a,b)=>b.score-a.score).slice(0,2);
    const curScored = currentVerses.map(v=>{ let score=0; qWords.forEach(w=>{ if(v.text.toLowerCase().includes(w)) score+=1; }); return {ref:`${book[1]} ${chapter}:${v.verse}`, text:v.text, score}; }).filter(v=>v.score>0).sort((a,b)=>b.score-a.score).slice(0,2);
    // Fetch live text for topic-index matches (currently-open verses already
    // have their text in-memory from the chapter that's loaded).
    const topicResults = await Promise.all(topicScored.map(async e=>{
      try {
        const text = await fetchVerseText(e.ref, version);
        return text ? {ref:e.ref, text} : null;
      } catch(err){
        console.warn("Couldn't fetch live text for "+e.ref, err);
        return null; // Skip silently rather than showing a broken citation.
      }
    }));
    const validTopicResults = topicResults.filter(Boolean);
    return [...validTopicResults, ...curScored.map(v=>({ref:v.ref, text:v.text}))].slice(0,3);
  }

  function renderMarks(){
    const bms=getBookmarks().sort((a,b)=> b.added-a.added);
    const hls=Object.entries(getHighlights()).map(([k,v])=> ({key:k, ...v})).sort((a,b)=> b.added-a.added);
    let html="";
    html+=`<div class="ai-card"><h3>Bookmarks (${bms.length})</h3>`;
    if(!bms.length) html+=`<p style="color:var(--ink-dim);font-size:13px">No bookmarks yet. Tap Bookmark in header to save a chapter.</p>`;
    else html+=`<div class="marks-list">${bms.map(bm=> `<div class="mark-item" data-type="bm" data-book="${bm.bookIdx}" data-ch="${bm.chapter}"><div class="left"><div class="ref">${bm.bookName} ${bm.chapter}</div><div class="snippet">Bookmarked chapter</div></div><div class="right"><button class="icon-btn remove-bm">Remove</button></div></div>`).join("")}</div>`;
    html+=`</div>`;
    html+=`<div class="ai-card"><h3>Highlights (${hls.length})</h3>`;
    if(!hls.length) html+=`<p style="color:var(--ink-dim);font-size:13px">No highlights yet. Tap a verse then choose a color in Verse tab.</p>`;
    else html+=`<div class="marks-list">${hls.map(hl=> `<div class="mark-item" data-type="hl" data-key="${hl.key}"><div class="left"><div class="ref"><span class="color-dot ${hl.color}" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>${hl.ref}</div><div class="snippet">${hl.text.slice(0,90)}</div></div><div class="right"><button class="icon-btn remove-hl">Remove</button></div></div>`).join("")}</div>`;
    html+=`</div>`;
    html+=`<button class="ai-action-btn" id="clearAllMarks">Clear All Marks</button>`;
    aiContent.innerHTML=html;
    aiContent.querySelectorAll(".mark-item[data-type='bm']").forEach(el=>{
      el.addEventListener("click", (e)=>{
        if(e.target.classList.contains("remove-bm")){ const bookIdx=parseInt(el.dataset.book); const ch=parseInt(el.dataset.ch); toggleBookmark(bookIdx,ch); renderBookmarkList(); renderChapterGrid(); renderBookList(""); updateBookmarkUI(); renderMarks(); return; }
        const bookIdx=parseInt(el.dataset.book); const ch=parseInt(el.dataset.ch); panes.a.bookIdx=bookIdx; panes.a.chapter=ch; if(compareMode && !panes.b._touched){ panes.b.bookIdx=bookIdx; panes.b.chapter=ch; loadPane("b"); } renderBookList(""); renderChapterGrid(); loadPane("a"); updateBookmarkUI();
      });
    });
    aiContent.querySelectorAll(".mark-item[data-type='hl']").forEach(el=>{
      el.addEventListener("click", (e)=>{
        if(e.target.classList.contains("remove-hl")){ removeHighlight(el.dataset.key); const p=panes.a; const book=BOOKS[p.bookIdx]; const key=p.version+"/"+book[0]+"/"+p.chapter; const verses=cache[key]; if(verses) renderVerses("a", verses); renderMarks(); return; }
        const hl=getHighlights()[el.dataset.key]; if(hl){ panes.a.bookIdx=hl.bookIdx; panes.a.chapter=hl.chapter; renderBookList(""); renderChapterGrid(); loadPane("a"); setTimeout(()=>{ selectedVerse={bookName:hl.bookName, chapter:hl.chapter, verseNum:hl.verseNum, text:hl.text, bookIdx:hl.bookIdx, key:el.dataset.key, color:hl.color}; openAi("verse"); }, 600); }
      });
    });
    const clearBtn=document.getElementById("clearAllMarks");
    if(clearBtn) clearBtn.addEventListener("click", ()=>{
      if(confirm("Clear all bookmarks and highlights?")){ localStorage.removeItem(STORAGE_BM); localStorage.removeItem(STORAGE_HL); renderBookmarkList(); renderChapterGrid(); renderBookList(""); updateBookmarkUI(); const p=panes.a; const book=BOOKS[p.bookIdx]; const key=p.version+"/"+book[0]+"/"+p.chapter; const verses=cache[key]; if(verses) renderVerses("a", verses); renderMarks(); }
    });
  }

  // Init
  renderBookmarkList(); renderBookList(""); renderChapterGrid(); loadPane("a"); updateBookmarkUI();
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeDrawer(); closeAi(); } });
})();
</script>
</body>
</html>
